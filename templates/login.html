<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DNHQ — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { navy: { 900: '#0f172a', 800: '#1e293b' } } } }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">

  <div class="w-full max-w-sm">

    <!-- Logo / brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-navy-900 shadow-lg mb-4">
        <svg class="w-7 h-7 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 12H3l9-9 9 9h-2M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">DNHQ Hosting</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to continue</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 px-8 py-8">

      {% if error %}
      <div class="mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700 flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') | e }}{% endif %}">
        <div class="space-y-4">
          <div>
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   autofocus required
                   class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50
                          focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent transition"
                   placeholder="Enter your username" />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   required
                   class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50
                          focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent transition"
                   placeholder="Enter your password" />
          </div>

          <button type="submit"
                  class="w-full py-2.5 px-4 bg-sky-500 hover:bg-sky-400 text-white text-sm font-semibold
                         rounded-xl transition shadow-sm mt-2">
            Sign in
          </button>
        </div>
      </form>

    </div>

    <p class="text-center text-xs text-slate-400 mt-6">DNHQ Web Agency · Hosting Dashboard</p>

  </div>

</body>
</html>
