<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Log — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { navy: { 900: '#0f172a', 800: '#1e293b' } } } }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">

  <div class="w-full max-w-sm">
    <!-- Logo / header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-navy-900 shadow-lg mb-4">
        <svg class="w-7 h-7 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-800">Email Log</h1>
      <p class="text-sm text-slate-500 mt-1">Enter your password to continue</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
      <form method="post" action="/email-login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">

        {% if error %}
        <div class="mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" name="password" autofocus
                 class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50
                        focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent"
                 placeholder="••••••••" />
        </div>

        <button type="submit"
                class="w-full py-2.5 bg-navy-900 hover:bg-navy-800 text-white text-sm font-semibold
                       rounded-xl transition shadow-sm">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      <a href="/" class="hover:text-slate-600 transition">← Back to Hosting Dashboard</a>
    </p>
  </div>

</body>
</html>
