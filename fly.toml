# fly.toml app configuration file generated for dnhq-hosting on 2026-05-01T08:32:58+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dnhq-hosting'
primary_region = 'syd'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'hosting_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
